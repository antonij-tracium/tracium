version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directories:
      - /api
      - /collector
      - /collector/extension/traciumauthextension
      - /collector/processor/traciumprocessor
      - /collector/exporter/clickhousespanexporter
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /api
      - /collector
      - /dashboard
      - /deploy/docker/migrate
    schedule:
      interval: weekly
