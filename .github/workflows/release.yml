name: Release
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}

permissions:
  contents: write   # upload the chart to the GitHub Release
  packages: write   # push images to GHCR

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: azure/setup-helm@v5
      # Images and the packaged chart are versioned by the tag without the
      # leading "v" (1.0.0, not v1.0.0). The chart in the repo must already
      # carry that appVersion so installing from a checkout of the tag pulls
      # the images this release publishes.
      - name: Derive version and check it matches the chart's appVersion
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_version="$(helm show chart deploy/helm/tracium | sed -n 's/^appVersion: *//p' | tr -d "\"'")"
          if [ "$app_version" != "$version" ]; then
            echo "::error file=deploy/helm/tracium/Chart.yaml::appVersion is $app_version but the release is $version; bump version and appVersion before releasing"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: make test
      - run: npm --prefix dashboard run build
      - run: npm --prefix dashboard run build:library
      - run: bash spec/codegen/gen-ts-types.sh
      - run: git diff --exit-code -- dashboard/src/types
      - run: make helm-lint
      - run: make smoke

  images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: collector, context: collector }
          - { name: api,        context: api }
          - { name: dashboard,  context: dashboard }
          - { name: migrate,    context: deploy/docker/migrate }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Must match the image repositories in deploy/helm/tracium/values.yaml.
      # Pre-releases publish their version tag but leave latest alone.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: type=raw,value=${{ needs.validate.outputs.version }}
          flavor: latest=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    needs: [validate, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - name: Package the Helm chart
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          make sync-generated
          helm package deploy/helm/tracium --version "$VERSION" --app-version "$VERSION"
      - uses: softprops/action-gh-release@v3
        with:
          files: tracium-*.tgz
