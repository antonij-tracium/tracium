name: Release
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: core_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://postgres:test-password@localhost:5432/core_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: azure/setup-helm@v5
      - run: make test
      - run: npm --prefix dashboard run build
      - run: npm --prefix dashboard run build:library
      - run: bash spec/codegen/gen-ts-types.sh
      - run: git diff --exit-code -- dashboard/src/types
      - run: make helm-lint
      - run: make smoke

  images:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: collector, context: collector }
          - { name: api,        context: api }
          - { name: dashboard,  context: dashboard }
          - { name: migrate,    context: deploy/docker/migrate }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Must match the chart's appVersion, which is the tag without the leading v.
      - name: Derive version (tag without the leading v)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.VERSION }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}/{1}:latest', github.repository_owner, matrix.name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package the Helm chart (version = tag without the leading v)
        run: |
          make sync-generated
          V="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/tracium --version "$V" --app-version "$V"
      - uses: softprops/action-gh-release@v3
        with:
          files: tracium-*.tgz
