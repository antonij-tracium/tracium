name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter calls the PR listFiles API

jobs:
  # Detect which components changed so slow jobs (npm, helm) only run when relevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.f.outputs.go }}
      dashboard: ${{ steps.f.outputs.dashboard }}
      spec: ${{ steps.f.outputs.spec }}
      helm: ${{ steps.f.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            go: ['collector/**', 'api/**', 'go.work']
            dashboard: ['dashboard/**']
            spec: ['spec/**']
            helm: ['deploy/**']

  go-test:
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: core_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://postgres:test-password@localhost:5432/core_test?sslmode=disable
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.spec == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            collector/go.sum
            api/go.sum
      - name: Test every Go module
        run: |
          set -e
          for mod in $(find collector api -name go.mod -not -path '*/_build/*'); do
            dir=$(dirname "$mod")
            echo "::group::go test $dir"
            (cd "$dir" && go test ./...)
            echo "::endgroup::"
          done

  dashboard:
    needs: changes
    if: ${{ needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.spec == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit
      - run: npm run build   # tsc typecheck + vite build
      - run: npm test
      - run: npm run build:library

  # The pinned TypeScript generator makes contract drift a release-blocking error.
  # Go models remain hand-written; gen-go-models.sh is not run.
  codegen-sync:
    needs: changes
    if: ${{ needs.changes.outputs.spec == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: bash spec/codegen/gen-ts-types.sh
      - name: Fail if generated types are stale
        run: git diff --exit-code -- dashboard/src/types

  helm-lint:
    needs: changes
    if: ${{ needs.changes.outputs.helm == 'true' || needs.changes.outputs.spec == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make sync-generated   # single-source pricing/schema into the chart
      - run: helm lint deploy/helm/tracium

  smoke:
    needs: changes
    # The full-stack smoke test is expensive (~25 min). Only run it when code
    # that ships in an image changed — skip it for docs/spec-only PRs.
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.helm == 'true' || needs.changes.outputs.spec == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise a fresh isolated stack
        run: bash deploy/tests/smoke.sh
