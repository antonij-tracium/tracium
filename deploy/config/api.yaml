server:
  addr: "0.0.0.0:8090"
  read_timeout_seconds: 30
  write_timeout_seconds: 30

storage:
  clickhouse_dsn: "${CLICKHOUSE_DSN}"

auth:
  enabled: true
  token_header: "Authorization"
  # Max register/login attempts per client IP per minute (brute-force / account
  # enumeration protection). Default 10; set a negative value to disable.
  # Override with AUTH_RATE_LIMIT_PER_MINUTE.
  rate_limit_per_minute: 10
  # Max ingest-key verification attempts per client IP per minute, on its own
  # bucket (not shared with login). The caller is a collector — machine traffic,
  # one IP fronting many senders — so it needs a larger, dedicated allowance;
  # sharing login's tiny bucket let a few invalid keys exhaust it and block
  # verification of legitimate keys. Default 120; negative disables. Override
  # with AUTH_VERIFY_RATE_LIMIT_PER_MINUTE.
  verify_rate_limit_per_minute: 120
  # Reverse proxies (IPs/CIDRs or dns:service-name) allowed to set X-Forwarded-For.
  # Empty means the header is ignored and the socket peer is always used, so a
  # direct client cannot spoof its source IP. Set this to your ingress network
  # only when that proxy overwrites the header from untrusted input (the shipped
  # dashboard nginx does). Override with AUTH_TRUSTED_PROXIES (comma-separated).
  trusted_proxies: []

telemetry:
  log_level: "info"
  log_format: "json"
