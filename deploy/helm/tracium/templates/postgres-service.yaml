apiVersion: v1
kind: Service
metadata:
  name: {{ include "tracium.fullname" . }}-postgres
  labels:
    {{- include "tracium.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # Headless service — pods connect directly via DNS; no load balancing needed
  # for a single-replica stateful service.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
