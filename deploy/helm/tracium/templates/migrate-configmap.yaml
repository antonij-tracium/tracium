apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracium.fullname" . }}-migrations
  labels:
    {{- include "tracium.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Recreate the schema bundle just before the migration Job runs, in the same
    # hook phases as the Job (a lower weight orders it first). Mirrors the SQL
    # files in collector/schema/ (see files/schema/README.md).
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
{{- range $path, $_ := .Files.Glob "files/schema/*" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
